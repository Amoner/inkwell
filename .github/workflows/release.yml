name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM
            asset_pattern: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-Intel
            asset_pattern: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            asset_pattern: x64-setup
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
            asset_pattern: amd64

    name: Release ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Build and release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS notarization (App Store Connect API key)
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Inkwell ${{ github.ref_name }}'
          releaseBody: 'See the assets below for download links.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Rename release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          LABEL="${{ matrix.label }}"
          PATTERN="${{ matrix.asset_pattern }}"

          # Get release assets and only process ones matching this job's platform pattern
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          mkdir -p /tmp/assets

          for ASSET_NAME in $ASSETS; do
            # Skip assets that don't contain this platform's identifier
            echo "$ASSET_NAME" | grep -qi "$PATTERN" || continue
            # Skip already-renamed assets
            echo "$ASSET_NAME" | grep -q "^Inkwell-v" && continue

            # Determine extension and build new name
            case "$ASSET_NAME" in
              *.app.tar.gz.sig) NEW_NAME="Inkwell-${TAG}-${LABEL}.app.tar.gz.sig" ;;
              *.app.tar.gz)     NEW_NAME="Inkwell-${TAG}-${LABEL}.app.tar.gz" ;;
              *.dmg)            NEW_NAME="Inkwell-${TAG}-${LABEL}.dmg" ;;
              *.nsis.zip.sig)   NEW_NAME="Inkwell-${TAG}-${LABEL}-Setup.nsis.zip.sig" ;;
              *.nsis.zip)       NEW_NAME="Inkwell-${TAG}-${LABEL}-Setup.nsis.zip" ;;
              *-setup.exe)      NEW_NAME="Inkwell-${TAG}-${LABEL}-Setup.exe" ;;
              *.msi.zip.sig)    NEW_NAME="Inkwell-${TAG}-${LABEL}.msi.zip.sig" ;;
              *.msi.zip)        NEW_NAME="Inkwell-${TAG}-${LABEL}.msi.zip" ;;
              *.msi)            NEW_NAME="Inkwell-${TAG}-${LABEL}.msi" ;;
              *.AppImage.tar.gz.sig) NEW_NAME="Inkwell-${TAG}-${LABEL}.AppImage.tar.gz.sig" ;;
              *.AppImage.tar.gz)     NEW_NAME="Inkwell-${TAG}-${LABEL}.AppImage.tar.gz" ;;
              *.AppImage)       NEW_NAME="Inkwell-${TAG}-${LABEL}.AppImage" ;;
              *.deb)            NEW_NAME="Inkwell-${TAG}-${LABEL}.deb" ;;
              *.rpm)            NEW_NAME="Inkwell-${TAG}-${LABEL}.rpm" ;;
              *) continue ;;
            esac

            gh release download "$TAG" --pattern "$ASSET_NAME" --dir /tmp/assets --clobber
            gh release delete-asset "$TAG" "$ASSET_NAME" --yes
            mv "/tmp/assets/$ASSET_NAME" "/tmp/assets/$NEW_NAME"
            gh release upload "$TAG" "/tmp/assets/$NEW_NAME"
            echo "Renamed: $ASSET_NAME → $NEW_NAME"
          done
