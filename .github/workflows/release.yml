name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-Intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    name: Release ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Build and release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS notarization (App Store Connect API key)
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Inkwell ${{ github.ref_name }}'
          releaseBody: 'See the assets below for download links.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Rename release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          LABEL="${{ matrix.label }}"

          # Get all release assets for this release
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)

          for ASSET_NAME in $ASSETS; do
            # Only rename assets that match default Tauri naming (contain underscores with version)
            case "$ASSET_NAME" in
              Inkwell_*|inkwell_*|inkwell-*)
                # Determine extension and build new name
                case "$ASSET_NAME" in
                  *.dmg)         NEW_NAME="Inkwell-${TAG}-${LABEL}.dmg" ;;
                  *.app.tar.gz)  NEW_NAME="Inkwell-${TAG}-${LABEL}.app.tar.gz" ;;
                  *.app.tar.gz.sig) NEW_NAME="Inkwell-${TAG}-${LABEL}.app.tar.gz.sig" ;;
                  *-setup.exe)   NEW_NAME="Inkwell-${TAG}-${LABEL}-Setup.exe" ;;
                  *.nsis.zip)    NEW_NAME="Inkwell-${TAG}-${LABEL}-Setup.nsis.zip" ;;
                  *.nsis.zip.sig) NEW_NAME="Inkwell-${TAG}-${LABEL}-Setup.nsis.zip.sig" ;;
                  *.msi)         NEW_NAME="Inkwell-${TAG}-${LABEL}.msi" ;;
                  *.msi.zip)     NEW_NAME="Inkwell-${TAG}-${LABEL}.msi.zip" ;;
                  *.msi.zip.sig) NEW_NAME="Inkwell-${TAG}-${LABEL}.msi.zip.sig" ;;
                  *.deb)         NEW_NAME="Inkwell-${TAG}-${LABEL}.deb" ;;
                  *.rpm)         NEW_NAME="Inkwell-${TAG}-${LABEL}.rpm" ;;
                  *.AppImage)    NEW_NAME="Inkwell-${TAG}-${LABEL}.AppImage" ;;
                  *.AppImage.tar.gz) NEW_NAME="Inkwell-${TAG}-${LABEL}.AppImage.tar.gz" ;;
                  *.AppImage.tar.gz.sig) NEW_NAME="Inkwell-${TAG}-${LABEL}.AppImage.tar.gz.sig" ;;
                  *) continue ;;
                esac

                if [ "$ASSET_NAME" != "$NEW_NAME" ]; then
                  # Download, delete old, upload with new name
                  gh release download "$TAG" --pattern "$ASSET_NAME" --dir /tmp/assets --clobber
                  gh release delete-asset "$TAG" "$ASSET_NAME" --yes
                  mv "/tmp/assets/$ASSET_NAME" "/tmp/assets/$NEW_NAME"
                  gh release upload "$TAG" "/tmp/assets/$NEW_NAME"
                  echo "Renamed: $ASSET_NAME → $NEW_NAME"
                fi
                ;;
            esac
          done
